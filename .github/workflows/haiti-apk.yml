name: Haiti Inji Wallet APK
on:
  push:
    branches: [haiti-apk-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-haiti-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout Haiti branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18.17.1'
          cache: npm
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" || { echo "Android sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;21.4.7075529"
      - name: Check Haiti backend configuration
        run: |
          grep -Fx 'MIMOTO_HOST=https://injiweb.haiti-pilot.mosip.net' .env
          grep -Fx 'ESIGNET_HOST=https://esignet.haiti-pilot.mosip.net' .env
          grep -Fx 'CREDENTIAL_REGISTRY_EDIT=false' .env
      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps
      - name: Create temporary test signing key
        run: |
          keytool -genkeypair -keystore android/app/release.keystore -storepass "$RELEASE_KEYSTORE_PASSWORD" -keypass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEYSTORE_ALIAS" -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Haiti Pilot Test, O=Inji"
        env:
          RELEASE_KEYSTORE_ALIAS: haiti-test
          RELEASE_KEYSTORE_PASSWORD: haititestonly123
      - name: Build Android universal release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_ALIAS: haiti-test
          RELEASE_KEYSTORE_PASSWORD: haititestonly123
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleResidentappRelease --no-daemon --stacktrace
      - name: Upload Haiti APK
        uses: actions/upload-artifact@v4
        with:
          name: Haiti-Inji-Wallet-APK
          path: android/app/build/outputs/apk/residentapp/release/Inji_universal.apk
          if-no-files-found: error
          retention-days: 14
